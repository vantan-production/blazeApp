name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call:

# チェックアウト以外に GITHUB_TOKEN は要らない。既定の権限は広すぎるため明示的に絞る
permissions:
  contents: read

jobs:
  back-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: back
    # back/.env.test は秘匿情報を含まないテスト専用のダミー値だが.gitignore対象でリポジトリに含まれないため、
    # CI実行環境（postgres/redisサービスのポート等）に合わせてここで明示的に設定する
    env:
      DATABASE_URL: postgres://test:test@localhost:5433/test_db
      REDIS_URL: redis://localhost:6380
      NODE_ENV: test
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_S3_BUCKET: test-bucket
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 既定では GITHUB_TOKEN が .git/config に残り、この後に走る npm ci /
          # npm test（依存パッケージとリポジトリのコードそのもの）から読み取れてしまう
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: back/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # 実ブラウザ（Chromium）での Cookie 往復テスト。
  # back-test は app.request() でハンドラを直接呼ぶため HttpOnly / Secure / SameSite の
  # 属性を誰も解釈していない。ここだけは本物のブラウザに判断させる（e2e/README.md 参照）
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # e2e は E2E_ 接頭辞の変数だけを見る（DATABASE_URL は開発用DBを指しうるため
    # 意図的に読まない。e2e/tests/fixtures.ts の assertTestDatabase 参照）
    env:
      E2E_DATABASE_URL: postgres://test:test@localhost:5433/test_db
      E2E_REDIS_URL: redis://localhost:6380
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 既定では GITHUB_TOKEN が .git/config に残り、この後に走る npm ci /
          # npm test（依存パッケージとリポジトリのコードそのもの）から読み取れてしまう
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # back は API サーバーとして起動されるため、実行時の依存が必要（playwright.config.ts の webServer）
      - name: Install backend dependencies
        working-directory: back
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        working-directory: e2e
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  front-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 既定では GITHUB_TOKEN が .git/config に残り、この後に走る npm ci /
          # npm test（依存パッケージとリポジトリのコードそのもの）から読み取れてしまう
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format & lint check (Biome)
        run: npm run check

      - name: Build
        run: npm run build
